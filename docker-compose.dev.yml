# Local development stack for Trends.
#
# Spins up NATS + Postgres on your machine so `npm run dev` has something to
# connect to. The container names match what the app expects when NATS_HOST
# and DATABASE_URL point at localhost.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   npm run prisma:migrate     # first time only
#   npm run dev

services:
  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"     # client connections
      - "8222:8222"     # http monitoring
    command: ["-m", "8222"]

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trends
      POSTGRES_PASSWORD: trends
      POSTGRES_DB: trends
    volumes:
      - trends-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trends -d trends"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  trends-postgres-data:
